<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hey Sam — Melody Trainer</title><style>body{font:16px system-ui;background:#111b20;color:#f3f5f4;margin:0;padding:18px}main{max-width:760px;margin:auto}h1{margin-bottom:0}p{color:#bdc9c9}.panel{background:#1d2b31;border:1px solid #35474c;border-radius:14px;padding:16px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}label{display:block;font-size:13px;color:#c9d6d6}select,input{width:100%;box-sizing:border-box;padding:9px;margin-top:5px;background:#101d22;color:white;border:1px solid #567078;border-radius:8px}input[type=checkbox]{width:auto}button{border:0;border-radius:9px;padding:12px 15px;background:#3aab88;color:#061a13;font-weight:700;margin:5px 4px 5px 0}button.secondary{background:#3b5159;color:white}#status{font-weight:700;color:#94dfc4}small{color:#afc2c4}#notes{font-size:20px;letter-spacing:2px;min-height:28px}</style></head><body><main><h1>Hey Sam</h1><p>Melody Trainer · Browser prototype v0.1</p><section class="panel"><div class="grid"><label>Instrument<select id="instrument"><option>Guitar</option><option>Mandolin</option><option>Mandola</option></select></label><label>Key<select id="key"></select></label><label>Scale<select id="scale"><option value="major">Major</option><option value="pent">Major pentatonic</option><option value="triad">Major triad</option></select></label><label>Phrase notes<input id="count" type="number" min="2" max="16" value="4"></label><label>Range<select id="octaves"><option value="1">One octave</option><option value="2">Two octaves</option></select></label><label>Starting note<select id="start"><option value="tonic">Tonic</option><option value="triad">Tonic triad tone</option><option value="any">Any allowed note</option></select></label><label>Rhythm<select id="rhythm"><option value="q">Quarter only</option><option value="qh">Quarter and half</option><option value="eqh">Eighth, quarter, half</option></select></label><label>Meter<select id="meter"><option value="4">4/4</option><option value="3">3/4</option></select></label><label>Tempo (BPM)<input id="tempo" type="number" min="40" max="180" value="80"></label><label>Count-in measures<select id="countin"><option value="0">0</option><option value="1" selected>1</option><option value="2">2</option></select></label><label>Click volume<input id="clickvol" type="range" min="0" max="100" value="35"></label><label>Melody volume<input id="melvol" type="range" min="0" max="100" value="75"></label><label>Melodic difficulty<select id="difficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option><option value="free">Unrestricted</option></select></label><label>Cadence<select id="cadence"><option value="tonic">End on tonic</option><option value="chord">End on tonic triad tone</option><option value="open">Open-ended</option><option value="any">Unrestricted</option></select></label><label>Playback mode<select id="mode"><option value="alternate">Alternate phrase / clicks</option><option value="loop">Loop phrase</option><option value="once">Play once</option></select></label><label>Advancement<select id="advance"><option value="manual">User controlled</option><option value="auto">Automatic (future: grading)</option></select></label></div></section><section class="panel"><div><button id="startbtn">Start session</button><button class="secondary" id="next">Next phrase</button><button class="secondary" id="again">Again</button><button class="secondary" id="slower">Slower</button><button class="secondary" id="faster">Faster</button></div><div><button class="secondary" id="stopmel">Stop melody</button><button class="secondary" id="stopall">Stop all</button></div><p id="status">Ready</p><div id="notes" aria-live="polite"></div><small>iOS requires a tap to enable audio. This version has button controls, not voice recognition. Mode changes apply at phrase boundaries. Automatic advancement and performance scoring are not implemented.</small></section></main><script>
const $=id=>document.getElementById(id), keys=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'], names=['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B']; keys.forEach(k=>{let o=document.createElement('option');o.value=k;o.textContent=k+' major';$('key').append(o)});$('key').value='G';
let ctx=null, timer=null, nextTick=0, tickIndex=0, phrase=[], phraseBeats=4, phaseStart=0, session=false, melodyStopped=false, epoch=0, activeMode='alternate', pendingMode=null, countBeats=0, phraseNumber=0;
const num=id=>Number($(id).value), pick=a=>a[Math.floor(Math.random()*a.length)], clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function makePhrase(){const root=keys.indexOf($('key').value), degrees={major:[0,2,4,5,7,9,11],pent:[0,2,4,7,9],triad:[0,4,7]}[$('scale').value], oct=num('octaves'), candidates=[];for(let n=0;n<=12*oct;n++)if(degrees.includes(n%12)||n===12*oct)candidates.push(n);const starters=candidates.filter(n=>$('start').value==='any'||($('start').value==='tonic'?n%12===0:[0,4,7].includes(n%12)));let prev=pick(starters), count=clamp(num('count'),2,16), result=[];for(let i=0;i<count;i++){let available=candidates;if(i===0)available=[prev];else if(i===count-1){let c=$('cadence').value;if(c==='tonic')available=candidates.filter(n=>n%12===0);if(c==='chord')available=candidates.filter(n=>[0,4,7].includes(n%12));if(c==='open')available=candidates.filter(n=>![0,4,7].includes(n%12));if(!available.length)available=candidates;}let diff=$('difficulty').value;if(i>0&&diff!=='free'){let max={easy:4,medium:7,hard:12}[diff];let restricted=available.filter(n=>Math.abs(n-prev)<=max);if(restricted.length)available=restricted;}let n=pick(available), durations={q:[1],qh:[1,2],eqh:[.5,1,2]}[$('rhythm').value], duration=pick(durations);result.push({midi:60+root+n,beats:duration});prev=n;}phrase=result;phraseBeats=Math.ceil(result.reduce((s,n)=>s+n.beats,0)/num('meter'))*num('meter');$('notes').textContent='Phrase: '+phrase.map(n=>names[n.midi%12]).join(' · ');}
function tone(midi,when,duration,vol){let f=440*Math.pow(2,(midi-69)/12),osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=f;gain.gain.setValueAtTime(0,when);gain.gain.linearRampToValueAtTime(vol,when+.012);gain.gain.exponentialRampToValueAtTime(.0001,when+Math.max(.06,duration*.86));osc.connect(gain).connect(ctx.destination);osc.start(when);osc.stop(when+duration+.03)}
function click(when,accent){let osc=ctx.createOscillator(),gain=ctx.createGain(),filter=ctx.createBiquadFilter();osc.type='triangle';osc.frequency.setValueAtTime(accent?1050:750,when);osc.frequency.exponentialRampToValueAtTime(accent?430:300,when+.035);filter.type='lowpass';filter.frequency.value=1400;gain.gain.setValueAtTime(.0001,when);gain.gain.exponentialRampToValueAtTime(Math.max(.0002,num('clickvol')/100*.3),when+.003);gain.gain.exponentialRampToValueAtTime(.0001,when+.065);osc.connect(filter).connect(gain).connect(ctx.destination);osc.start(when);osc.stop(when+.07)}
function playPhrase(when){let t=when,bps=60/num('tempo');for(const n of phrase){tone(n.midi,t,n.beats*bps,num('melvol')/100*.18);t+=n.beats*bps}}
function scheduler(){if(!session||!ctx)return;const bps=60/num('tempo');while(nextTick<ctx.currentTime+.11){let beat=tickIndex-countBeats, inCount=beat<0, slot=beat>=0?Math.floor(beat/phraseBeats):0, slotBeat=beat>=0?beat%phraseBeats:0;if(!inCount&&slotBeat===0){if(pendingMode){activeMode=pendingMode;pendingMode=null}if(!melodyStopped&&(activeMode==='loop'||(activeMode==='once'&&slot===0)||(activeMode==='alternate'&&slot%2===0)))playPhrase(nextTick);$('status').textContent=melodyStopped?'Metronome only':activeMode+' · '+num('tempo')+' BPM';}click(nextTick,tickIndex%num('meter')===0);nextTick+=bps;tickIndex++;}}
function stop(){session=false;clearInterval(timer);timer=null;epoch++;$('status').textContent='Stopped'}
$('startbtn').onclick=async()=>{stop();ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();makePhrase();activeMode=$('mode').value;pendingMode=null;melodyStopped=false;countBeats=num('countin')*num('meter');tickIndex=0;nextTick=ctx.currentTime+.1;session=true;timer=setInterval(scheduler,25);scheduler();$('status').textContent='Playing · count-in '+num('countin')+' measure(s)'};
$('mode').onchange=()=>{pendingMode=$('mode').value;$('status').textContent='Mode change queued: '+pendingMode};$('stopmel').onclick=()=>{melodyStopped=true;$('status').textContent='Melody stopped; metronome continues (scheduled notes may finish)'};$('stopall').onclick=stop;
$('next').onclick=()=>{makePhrase();if(session){tickIndex=0;countBeats=num('countin')*num('meter');nextTick=Math.max(ctx.currentTime+.1,nextTick);}$('status').textContent='New phrase ready'};
$('again').onclick=()=>{if(session){tickIndex=0;countBeats=num('countin')*num('meter');nextTick=Math.max(ctx.currentTime+.1,nextTick);melodyStopped=false;}$('status').textContent='Repeating phrase'};
$('slower').onclick=()=>{$('tempo').value=clamp(num('tempo')-5,40,180)};$('faster').onclick=()=>{$('tempo').value=clamp(num('tempo')+5,40,180)};
</script></body></html>
