<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hey Sam — Melody Trainer</title><style>
*{box-sizing:border-box}html{width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}body{font:12px system-ui,-apple-system,sans-serif;background:#111b20;color:#f3f5f4;margin:0;width:100%;overflow-x:hidden}main{width:100%;max-width:760px;margin:auto;padding:5px}h1{font-size:17px;margin:0;white-space:nowrap}p{color:#bdc9c9}.panel{background:#1d2b31;border:1px solid #35474c;border-radius:9px;padding:6px;margin:4px 0}.settings{display:flex;flex-direction:column;gap:0}.settings>.settings-row,.settings>.mix-row{padding:5px 0;border-bottom:1px solid #3b5056}.settings>:last-child{border-bottom:0}.settings-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;align-items:end}.settings-row.two{grid-template-columns:repeat(2,minmax(0,1fr))}.settings-row.header{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center}.settings-row label{min-width:0;display:block;font-size:10px;color:#c9d6d6;white-space:nowrap}.settings-row select{display:block;width:100%;min-width:0;height:29px;padding:3px 4px;margin-top:2px;background:#101d22;color:white;border:1px solid #567078;border-radius:5px;font-size:12px}.mix-row{display:flex;justify-content:flex-end;align-items:center;gap:5px}.sound-box{min-width:0}.sound-box label{font-size:10px;color:#c9d6d6}.sound-box select{width:100%;background:#101d22;color:white;border:1px solid #567078;border-radius:5px;height:29px;font-size:11px}.mix-controls{display:flex;justify-content:flex-end;gap:5px;min-width:0;width:100%}.vol-item{display:flex;flex-direction:column;align-items:center;gap:2px;color:#c9d6d6;font-size:10px;min-width:40px}.vol-item input[type=range]{appearance:slider-vertical;-webkit-appearance:slider-vertical;width:28px;height:115px;writing-mode:vertical-lr;direction:rtl;margin:0;accent-color:#3aab88}.vol-item output{font-size:15px;font-weight:750;font-variant-numeric:tabular-nums}.tempo-buttons{display:flex;flex-direction:column;gap:3px;height:115px;align-self:flex-start;margin-top:12px}.tempo-buttons button{margin:0;padding:2px 4px;font-size:10px;flex:1;min-height:0}button{border:0;border-radius:6px;padding:7px 8px;background:#3aab88;color:#061a13;font-weight:700;margin:2px;font-size:11px}button.secondary{background:#3b5159;color:white}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}.controls button{width:100%;margin:0;min-height:68px}#status{font-weight:700;color:#94dfc4;margin:4px 0;font-size:12px}#phrase-wrap{position:relative;min-height:40px}#notes{display:flex;flex-wrap:wrap;gap:3px;min-height:36px;margin:4px 0}.note{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:28px;padding:2px 4px;background:#101d22;border-radius:5px}.note-name{font-size:14px;font-weight:650}.degree{font-size:10px;color:#94dfc4}.notes-label{align-self:center;font-size:11px;color:#bdc9c9;margin-right:2px}.barline{width:2px;align-self:stretch;background:#91a9a8;opacity:.8;margin:2px 3px}#reveal{position:absolute;inset:0;width:100%;margin:0;background:#314d55;color:#fff;border:1px solid #6d9a99;font-size:13px;z-index:1}#reveal[hidden]{display:none}small{color:#afc2c4;font-size:10px;line-height:1.2;display:block}@media(max-width:370px){main{padding:4px}.panel{padding:5px}.settings-row{gap:3px}.settings-row label{font-size:9px}.settings-row select{font-size:11px;padding:2px;height:27px}.vol-item{min-width:34px}.mix-controls{gap:2px}.vol-item input[type=range]{height:100px}.tempo-buttons{height:100px}button{padding:6px;font-size:10px}}@media(max-height:750px){.settings{gap:2px}.vol-item input[type=range]{height:95px}.tempo-buttons{height:95px}.panel{margin:3px 0;padding:5px}small{font-size:9px}}

.key-pair{display:flex;gap:3px;min-width:0}.key-pair select:first-child{flex:0 0 39%;width:39%}.key-pair select:last-child{flex:1;width:0}
.mix-controls{justify-content:space-between;gap:0}.vol-item{flex:1;min-width:0;position:relative}.vol-item.divider-before{border-left:1px solid #5c7074}.vol-item input[type=range]{width:42px;max-width:100%;height:136px;touch-action:none}.vol-item input[type=range]::-webkit-slider-thumb{transform:scale(1.3)}.vol-item output{font-size:18px}.tempo-buttons{height:136px;margin-top:12px;flex:1;min-width:0}.tempo-buttons button{width:calc(100% - 4px);font-size:11px}
.controls .start-button{background:#3aab88;color:#061a13;border:1px solid #3aab88}.controls .start-button.playing{background:#3b5159;color:#fff;border:1px solid #3aab88}.controls .next-button{border:1px solid #4d9fe4}.controls .stop-button{border:1px solid #d95757}.controls .stop-all{background:#3b5159;color:white}.controls .stop-all.playing{background:#b8323e;color:white}
@media(max-width:370px){.vol-item input[type=range]{height:112px;width:36px}.tempo-buttons{height:112px}.vol-item output{font-size:16px}}
@media(max-height:750px){.vol-item input[type=range]{height:110px}.tempo-buttons{height:110px}}
</style></head><body><main><section class="panel settings" aria-label="Practice settings">
<div class="settings-row header"><h1>Hey Sam! <span style="font-size:10px;font-weight:400;color:#bdc9c9">v0.8</span></h1><label>Instrument<select id="instrument"><option>Guitar</option><option>Mandolin</option><option>Mandola</option></select></label></div>
<div class="settings-row"><label>Key<div class="key-pair"><select id="key"></select><select id="quality" aria-label="Major or minor"><option value="major">Major</option><option value="minor">Minor</option></select></div></label><label>Note Selection<select id="scale"><option value="major">Full Major Scale</option><option value="pent">Major Pentatonic Scale</option><option value="triad">Major Triad</option></select></label><label>Range<select id="octaves"><option value="1">1 octave</option><option value="2">2 octaves</option></select></label></div>
<div class="settings-row"><label>Meter<select id="meter"><option value="4">4/4</option><option value="3">3/4</option></select></label><label>Rhythm<select id="rhythm"><option value="q">Quarter</option><option value="qh">Quarter / half</option><option value="eqh">8th / ¼ / ½</option></select></label><label>Melodic difficulty<select id="difficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option><option value="free">Unrestricted</option></select></label></div>
<div class="settings-row"><label>Phrase notes<select id="count"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4" selected>4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option></select></label><label>Start note<select id="start"><option value="tonic">Tonic</option><option value="triad">Triad tone</option><option value="any">Any note</option></select></label><label>End note<select id="cadence"><option value="tonic">Tonic</option><option value="chord">Triad tone</option><option value="open">Anticipatory Notes</option><option value="any">Any note</option></select></label></div>
<div class="mix-row"><div class="mix-controls"><label class="vol-item" for="mastervol">Master<input id="mastervol" type="range" min="0" max="100" value="65"><output id="masterval">65</output></label><label class="vol-item divider-before" for="clickvol">Click<input id="clickvol" type="range" min="0" max="100" value="65"><output id="clickval">65</output></label><label class="vol-item" for="melvol">Melody<input id="melvol" type="range" min="0" max="100" value="30"><output id="melval">30</output></label><label class="vol-item divider-before" for="tempo">Tempo<input id="tempo" type="range" min="40" max="180" step="5" value="80"><output id="tempoval">80</output></label><div class="tempo-buttons"><button class="secondary" id="faster" type="button">Faster</button><button class="secondary" id="slower" type="button">Slower</button></div></div></div>
<div class="settings-row two"><label>Playback mode<select id="mode"><option value="alternate">Alternate phrase / clicks</option><option value="loop">Loop phrase</option><option value="once">Play once</option></select></label><label>Advancement<select id="advance"><option value="manual">User controlled</option><option value="auto">Automatic (future)</option></select></label></div>
</section><section class="panel"><div class="controls"><button id="startbtn" class="start-button">Start Session</button><button class="secondary next-button" id="next">Next Phrase</button><button class="secondary stop-button stop-all" id="stopall">Stop All</button><button class="secondary stop-button" id="stopmel">Stop Melody</button></div><p id="status">Ready</p><div id="phrase-wrap"><div id="notes" aria-live="polite"></div><button id="reveal" type="button">Show Phrase</button></div><small>Browser prototype v0.8. Uses the default soft plucked tone. If silent, check iPhone Silent Mode. Voice commands and automatic grading are not yet implemented.</small></section></main><script>
const $=id=>document.getElementById(id), keys=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'], names=['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B']; keys.forEach(k=>{let o=document.createElement('option');o.value=k;o.textContent=k;$('key').append(o)});$('key').value='G';
const SETTINGS_KEY='hey-sam-settings-v1';
const settingIds=['instrument','key','quality','scale','octaves','meter','rhythm','difficulty','count','start','cadence','mastervol','clickvol','melvol','tempo','mode','advance'];
try{const saved=JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}');for(const id of settingIds){if(saved[id]!==undefined&&Array.from($(id).options||[]).some(o=>o.value===String(saved[id]))||saved[id]!==undefined&&$(id).type==='range'&&Number.isFinite(Number(saved[id]))){$(id).value=String(saved[id]);}}}catch(e){console.warn('Could not restore settings',e)}
function updateNoteSelection(){
 const minor=$('quality').value==='minor';
 const labels=minor?['Full Minor Scale','Minor Pentatonic Scale','Minor Triad']:['Full Major Scale','Major Pentatonic Scale','Major Triad'];
 Array.from($('scale').options).forEach((o,i)=>o.textContent=labels[i]);
 const disallow=$('scale').value==='triad';
 const anticipation=$('cadence').querySelector('option[value="open"]');anticipation.disabled=disallow;
 if(disallow&&$('cadence').value==='open')$('cadence').value='any';
}
$('quality').addEventListener('change',()=>{updateNoteSelection();saveSettings()});
$('scale').addEventListener('change',()=>{updateNoteSelection();saveSettings()});
updateNoteSelection();
function saveSettings(){try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(Object.fromEntries(settingIds.map(id=>[id,$(id).value]))))}catch(e){console.warn('Could not save settings',e)}}
for(const id of settingIds){$(id).addEventListener('input',saveSettings);$(id).addEventListener('change',saveSettings)}

let ctx=null, master=null, guitarSamples=new Map(), woodSamples=[], timer=null, nextTick=0, tickIndex=0, phrase=[], phraseBeats=4, phaseStart=0, session=false, melodyStopped=false, epoch=0, activeMode='alternate', pendingMode=null, countBeats=0, phraseNumber=0;
const num=id=>Number($(id).value), pick=a=>a[Math.floor(Math.random()*a.length)], clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function makePhrase(){
 const root=keys.indexOf($('key').value), minor=$('quality').value==='minor';
 const scaleSemis=minor?[0,2,3,5,7,8,10]:[0,2,4,5,7,9,11];
 const triad=minor?[0,3,7]:[0,4,7];
 const degrees=({major:scaleSemis,pent:minor?[0,3,5,7,10]:[0,2,4,7,9],triad})[$('scale').value];
 const oct=num('octaves'), candidates=[];
 for(let n=0;n<=12*oct;n++)if(degrees.includes(n%12))candidates.push(n);
 const starters=candidates.filter(n=>$('start').value==='any'||($('start').value==='tonic'?n%12===0:triad.includes(n%12)));
 let prev=pick(starters),count=clamp(num('count'),1,9),result=[];
 for(let i=0;i<count;i++){
  let available=candidates;
  if(i===0)available=[prev];
  else if(i===count-1){const c=$('cadence').value;
   if(c==='tonic')available=candidates.filter(n=>n%12===0);
   if(c==='chord')available=candidates.filter(n=>triad.includes(n%12));
   if(c==='open'){
    // Prefer 2, 4, 7 where available; in natural minor the seventh is a whole tone below tonic.
    const preferred=[scaleSemis[1],scaleSemis[3],scaleSemis[6]];
    available=candidates.filter(n=>preferred.includes(n%12));
    if(!available.length)available=candidates.filter(n=>!triad.includes(n%12));
   }
   if(!available.length)available=candidates;
  }
  let diff=$('difficulty').value;
  if(i>0&&diff!=='free'){let max={easy:4,medium:7,hard:12}[diff];let restricted=available.filter(n=>Math.abs(n-prev)<=max);if(restricted.length)available=restricted;}
  let n=pick(available),durations={q:[1],qh:[1,2],eqh:[.5,1,2]}[$('rhythm').value],duration=pick(durations);
  result.push({midi:60+root+n,beats:duration});prev=n;
 }
 phrase=result;phraseBeats=Math.ceil(result.reduce((s,n)=>s+n.beats,0)/num('meter'))*num('meter');renderNotes(root);
}
function hidePhrase(){$('reveal').hidden=false;}
$('reveal').onclick=()=>{$('reveal').hidden=true};
function renderNotes(root){const host=$('notes');host.replaceChildren();const label=document.createElement('span');label.className='notes-label';label.textContent='Phrase:';host.append(label);const major=$('quality').value==='minor'?[0,2,3,5,7,8,10]:[0,2,4,5,7,9,11];let beat=0;const meter=num('meter');for(const n of phrase){if(beat>0&&Math.abs(beat/meter-Math.round(beat/meter))<.001){const bar=document.createElement('span');bar.className='barline';bar.setAttribute('aria-label','Measure divider');host.append(bar)}const offset=((n.midi-(60+root))%12+12)%12;const degree=major.indexOf(offset)+1;const item=document.createElement('span');item.className='note';const name=document.createElement('span');name.className='note-name';name.textContent=names[n.midi%12];const deg=document.createElement('span');deg.className='degree';deg.textContent=degree?String(degree):'–';item.append(name,deg);host.append(item);beat+=n.beats;}hidePhrase();}
for(const [id,out] of [['mastervol','masterval'],['clickvol','clickval'],['melvol','melval'],['tempo','tempoval']]){$(id).addEventListener('input',()=>$(out).textContent=$(id).value)}
for(const [id,out] of [['mastervol','masterval'],['clickvol','clickval'],['melvol','melval'],['tempo','tempoval']])$(out).textContent=$(id).value;
// Procedural plucked-string samples: band-limited, damped delay-line synthesis.
// No recorded instrument samples are bundled in this version.
function guitarBuffer(midi){
 const cacheKey='soft:'+midi;
 if(guitarSamples.has(cacheKey))return guitarSamples.get(cacheKey);
 const sr=ctx.sampleRate, freq=440*Math.pow(2,(midi-69)/12), length=Math.round(sr*2.5);
 const buf=ctx.createBuffer(1,length,sr), out=buf.getChannelData(0);
 // Softer provisional plucked-string synthesis: low harmonics and a rounded pick attack.
 // This is NOT a recorded guitar sample; real licensed recordings remain a future upgrade.
 const soft=true;const harmonics=soft?[1,.075,.018]:[1,.26,.11,.045,.018], phases=[0,.23,.71,1.2,1.8];
 for(let i=0;i<length;i++){
  const t=i/sr, attack=1-Math.exp(-t*(soft?90:240)), decay=Math.exp(-t*(soft?2.4:1.45+freq/800));
  let v=0;
  for(let h=0;h<harmonics.length;h++)v+=harmonics[h]*Math.sin(2*Math.PI*freq*(h+1)*t+phases[h])*Math.exp(-t*h*.9);
  out[i]=v*attack*decay*(soft?.23:.34);
 }
 guitarSamples.set(cacheKey,buf);return buf;
}
function woodBuffer(accent){
 const sr=ctx.sampleRate, duration=.11, buf=ctx.createBuffer(1,Math.round(sr*duration),sr), out=buf.getChannelData(0);
 let seed=accent?73431:21913, low=0, low2=0;
 for(let i=0;i<out.length;i++){
   seed=(1664525*seed+1013904223)>>>0;const noise=seed/4294967296*2-1;
   low+=.12*(noise-low);low2+=.075*(low-low2);
   const t=i/sr, fundamental=accent?490:365;
   const body=Math.sin(2*Math.PI*fundamental*t)*Math.exp(-t*62);
   const thump=low2*Math.exp(-t*82);
   const edge=(low-low2)*Math.exp(-t*140);
   out[i]=(.57*body+.35*thump+.08*edge)*Math.min(1,t/.002)*.55;
 }
 return buf;
}
function initAudio(){
 if(master)return;
 master=ctx.createGain();const compressor=ctx.createDynamicsCompressor();
 compressor.threshold.value=-19;compressor.knee.value=18;compressor.ratio.value=3;compressor.attack.value=.008;compressor.release.value=.15;
 master.connect(compressor).connect(ctx.destination);
 woodSamples=[woodBuffer(false),woodBuffer(true)];
 $('mastervol').oninput=()=>master.gain.setTargetAtTime(num('mastervol')/100,ctx.currentTime,.015);
 master.gain.value=num('mastervol')/100;
}
function tone(midi,when,duration,vol){
 const src=ctx.createBufferSource(), gain=ctx.createGain();src.buffer=guitarBuffer(midi);
 const end=Math.max(.12,Math.min(2.65,duration+.18));
 gain.gain.setValueAtTime(0,when);gain.gain.linearRampToValueAtTime(Math.max(.0001,vol),when+.012);
 gain.gain.setValueAtTime(Math.max(.0001,vol),when+Math.max(.013,end-.12));
 gain.gain.exponentialRampToValueAtTime(.0001,when+end);
 src.connect(gain).connect(master);src.start(when);src.stop(when+end+.01);
}
function click(when,accent){
 const src=ctx.createBufferSource(), gain=ctx.createGain();src.buffer=woodSamples[accent?1:0];
 gain.gain.value=num('clickvol')/100*1.35;
 src.connect(gain).connect(master);src.start(when);
}
function playPhrase(when){let t=when,bps=60/num('tempo');for(const n of phrase){tone(n.midi,t,n.beats*bps,num('melvol')/100*.27);t+=n.beats*bps}}
function scheduler(){if(!session||!ctx)return;const bps=60/num('tempo');while(nextTick<ctx.currentTime+.11){let beat=tickIndex-countBeats, inCount=beat<0, slot=beat>=0?Math.floor(beat/phraseBeats):0, slotBeat=beat>=0?beat%phraseBeats:0;if(!inCount&&slotBeat===0){if(pendingMode){activeMode=pendingMode;pendingMode=null}if(!melodyStopped&&(activeMode==='loop'||(activeMode==='once'&&slot===0)||(activeMode==='alternate'&&slot%2===0)))playPhrase(nextTick);$('status').textContent=melodyStopped?'Metronome only':activeMode+' · '+num('tempo')+' BPM';}click(nextTick,tickIndex%num('meter')===0);nextTick+=bps;tickIndex++;}}
function stop(){ $('startbtn').classList.remove('playing');$('stopall').classList.remove('playing');session=false;clearInterval(timer);timer=null;epoch++;$('status').textContent='Stopped'}
$('startbtn').onclick=async()=>{stop();ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();initAudio();makePhrase();activeMode=$('mode').value;pendingMode=null;melodyStopped=false;countBeats=num('meter');tickIndex=0;nextTick=ctx.currentTime+.1;session=true;$('startbtn').classList.add('playing');$('stopall').classList.add('playing');timer=setInterval(scheduler,25);scheduler();$('status').textContent='Playing · count-in 1 measure'};
$('mode').onchange=()=>{pendingMode=$('mode').value;$('status').textContent='Mode change queued: '+pendingMode};$('stopmel').onclick=()=>{melodyStopped=true;$('status').textContent='Melody stopped; metronome continues (scheduled notes may finish)'};$('stopall').onclick=stop;
$('next').onclick=()=>{makePhrase();if(session){tickIndex=0;countBeats=num('meter');nextTick=Math.max(ctx.currentTime+.1,nextTick);}$('status').textContent='New phrase ready'};

$('slower').onclick=()=>{$('tempo').value=clamp(num('tempo')-5,40,180);$('tempoval').textContent=$('tempo').value;saveSettings()};$('faster').onclick=()=>{$('tempo').value=clamp(num('tempo')+5,40,180);$('tempoval').textContent=$('tempo').value;saveSettings()};
</script></body></html>
